[package]
name = "game"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { package = "journey-engine", version = "1.3.0" }
resonance = { package = "journey-sound", version = "1.3.0" }
cadence = { package = "journey-sequencer", version = "1.3.0" }
wasm-bindgen = "0.2.87"
wgpu = { version = "27.0", features = ["webgl"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
